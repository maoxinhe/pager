<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网站访问诊断 · 一次定位到底哪一层断了</title>
<style>
  :root{
    --bg:#0b1220; --card:#131c2f; --card2:#0f1729; --line:#243049;
    --txt:#e6edf7; --dim:#93a4bf; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --info:#3b82f6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px 16px 60px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  h2 .n{width:22px;height:22px;border-radius:6px;background:var(--info);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
  label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px}
  input{width:100%;padding:11px 13px;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
  input:focus{border-color:var(--info)}
  button{background:var(--info);color:#fff;border:0;padding:12px 20px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:12px;width:100%}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:13px;padding:9px 14px;width:auto;margin-top:0;font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:500;font-size:12px;white-space:nowrap}
  td.ip{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .t-ok{background:rgba(34,197,94,.15);color:#4ade80}
  .t-bad{background:rgba(239,68,68,.15);color:#f87171}
  .t-warn{background:rgba(245,158,11,.15);color:#fbbf24}
  .t-wait{background:rgba(148,163,184,.15);color:#94a3b8}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .verdict{border-left:4px solid var(--info);background:var(--card2);border-radius:0 8px 8px 0;padding:14px 16px;margin-top:6px}
  .verdict.ok{border-color:var(--ok)} .verdict.bad{border-color:var(--bad)} .verdict.warn{border-color:var(--warn)}
  .verdict .vt{font-weight:700;font-size:15px;margin-bottom:6px}
  .verdict p{margin:5px 0;font-size:13.5px;color:#cbd5e1}
  .verdict .fix{background:rgba(0,0,0,.28);border-radius:6px;padding:10px 12px;margin-top:10px;font-size:13px;color:#a5b4fc}
  textarea{width:100%;height:170px;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:11px;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;outline:none;resize:vertical}
  .note{font-size:12.5px;color:var(--dim);margin-top:10px}
  code{background:var(--card2);padding:1.5px 6px;border-radius:4px;font-size:12.5px;color:#a5b4fc;font-family:ui-monospace,Menlo,Consolas,monospace}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>网站访问诊断</h1>
  <div class="sub">30 秒定位「打不开」到底卡在哪一层 · 全部在本机完成，不上传任何信息</div>

  <div class="card">
    <label for="domain">1. 输入你打不开的网址（只填域名，不要带 https:// 和路径）</label>
    <input id="domain" placeholder="例如 example.com" autocomplete="off" spellcheck="false">
    <button id="go">开始诊断</button>
    <div class="note">请在<b>打不开的那台设备</b>、用<b>打不开的那个网络</b>（WiFi/流量）打开本页。换了网络测，结果就不准了。</div>
  </div>

  <div id="results" class="hide">
    <div class="card">
      <h2><span class="n">A</span>公共 DNS 能否连通</h2>
      <div class="note" style="margin:0 0 8px">检验「运营商屏蔽 1.1.1.1」这个说法是否成立。</div>
      <table><thead><tr><th>解析器</th><th>结果</th><th>耗时</th></tr></thead><tbody id="tA"></tbody></table>
    </div>

    <div class="card">
      <h2><span class="n">B</span>你的域名解析成了什么 IP</h2>
      <div class="note" style="margin:0 0 8px">几个解析器给的答案<b>不一致</b>，说明存在 DNS 污染。</div>
      <table><thead><tr><th>解析器</th><th>返回的 IP</th><th>判断</th></tr></thead><tbody id="tB"></tbody></table>
    </div>

    <div class="card">
      <h2><span class="n">C</span>服务器连通性</h2>
      <div class="note" style="margin:0 0 8px">这一层坏掉的话，<b>换域名完全没用</b>。</div>
      <table><thead><tr><th>目标</th><th>结果</th><th>耗时</th></tr></thead><tbody id="tC"></tbody></table>
    </div>

    <div class="card">
      <h2><span class="n">D</span>结论</h2>
      <div id="verdict"><p style="color:var(--dim)">诊断中…</p></div>
    </div>

    <div class="card">
      <h2><span class="n">E</span>把结果发回去</h2>
      <textarea id="report" readonly></textarea>
      <div style="display:flex;gap:9px;margin-top:11px">
        <button class="ghost" id="copy">复制报告</button>
        <button class="ghost" id="again">重新检测</button>
      </div>
    </div>
  </div>
</div>

<script>
/* Cloudflare 官方网段（含 104.16/13、188.114.96/20 等非整字节掩码，须按位判断） */
const CF_RANGES=["104.16.0.0/13","104.24.0.0/14","172.64.0.0/13","162.158.0.0/15","188.114.96.0/20",
  "198.41.128.0/17","198.41.192.0/18","190.93.240.0/20","108.162.192.0/18","23.235.32.0/20"]
  .map(s=>{const [b,n]=s.split("/");return [b.split(".").map(Number),+n]});

function ipToInt(ip){
  const p=String(ip).trim().split(".");
  if(p.length!==4||p.some(x=>!/^\d{1,3}$/.test(x)||Number(x)>255)) return null;
  return ((Number(p[0])<<24)>>>0)+(Number(p[1])<<16)+(Number(p[2])<<8)+Number(p[3]);
}
function isCF(ip){
  const v=ipToInt(ip);
  if(v===null) return false;
  return CF_RANGES.some(([bp,bits])=>{
    const base=((bp[0]<<24)>>>0)+(bp[1]<<16)+(bp[2]<<8)+bp[3];
    const mask=bits===0?0:(0xFFFFFFFF<<(32-bits))>>>0;
    return (v&mask)===(base&mask);
  });
}

/*  经实测:国内可直连且带 CORS 的只有 AliDNS;Cloudflare/Google 的 DoH 往往连不上(这正是要测的现象)。
    因此 Cloudflare/Google 两条测"连不上"本身就是结论,不能依赖其返回体。 */
const DNS=[
  {n:"Cloudflare (1.1.1.1)",u:d=>`https://cloudflare-dns.com/dns-query?name=${d}&type=A`,h:{"Accept":"application/dns-json"}},
  {n:"Google (8.8.8.8)",u:d=>`https://dns.google/resolve?name=${d}&type=A`,h:{}},
  {n:"阿里 AliDNS",u:d=>`https://dns.alidns.com/resolve?name=${d}&type=A`,h:{}},
  {n:"阿里 AliDNS(备)",u:d=>`https://223.5.5.5/resolve?name=${d}&type=A`,h:{}}
];

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function timedFetch(url,opt={},ms=6000){
  const t=performance.now();
  const r=await withTimeout(fetch(url,{...opt,cache:"no-store",mode:opt.mode||"cors",credentials:"omit"}),ms);
  return {ok:r.ok,status:r.status,ms:Math.round(performance.now()-t),r};
}

const rows=(tb,html)=>document.getElementById(tb).innerHTML=html;
const wait='<span class="tag t-wait"><span class="spin"></span> 等待</span>';

async function resolveOne(dns,domain){
  const t=performance.now();
  const done=r=>({ms:Math.round(performance.now()-t),...r});
  try{
    const r=await withTimeout(fetch(dns.u(domain),{headers:dns.h,cache:"no-store",credentials:"omit",mode:"cors"}),7000);
    if(!r.ok) return done({st:"fail",err:"HTTP "+r.status});
    const j=await r.json();
    const ips=(j.Answer||[]).filter(a=>a.type===1).map(a=>a.data);
    if(!ips.length) return done({st:"nx",ips:[]});
    return done({st:"ok",ips});
  }catch(e){
    const m=e.message||String(e);
    // 跨域被拦：说明服务器可达（连接建立并返回了响应头），只是读不到内容
    if(/CORS|not allowed|Access-Control/i.test(m)) return done({st:"cors",ips:[]});
    return done({st:"unreach",err:m});
  }
}

async function tcpTest(url,ms=8000){
  const t=performance.now();
  try{
    await withTimeout(fetch(url,{mode:"no-cors",cache:"no-store"}),ms);
    return {ok:true,ms:Math.round(performance.now()-t)};
  }catch(e){
    const m=e.message||String(e);
    return {ok:false,ms:Math.round(performance.now()-t),err:m};
  }
}

document.getElementById("go").onclick=run;
document.getElementById("again").onclick=()=>{document.getElementById("results").classList.add("hide");window.scrollTo(0,0)};
document.getElementById("copy").onclick=()=>{const t=document.getElementById("report");t.select();document.execCommand("copy");const b=document.getElementById("copy");b.textContent="已复制 ✓";setTimeout(()=>b.textContent="复制报告",1800)};

async function run(){
  const domain=document.getElementById("domain").value.trim().replace(/^https?:\/\//,"").replace(/\/.*$/,"").trim();
  if(!domain){alert("请先填域名");return}
  const btn=document.getElementById("go");btn.disabled=true;btn.innerHTML='<span class="spin"></span> 诊断中…';
  document.getElementById("results").classList.remove("hide");
  document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"});

  // ---- A: DNS 连通性 ----
  rows("tA",DNS.map(d=>`<tr><td>${esc(d.n)}</td><td>${wait}</td><td id="a${DNS.indexOf(d)}">-</td></tr>`).join(""));
  const aRes=await Promise.all(DNS.map(d=>withTimeout(resolveOne(d,"example.com"),8000).catch(e=>({st:"unreach",err:String(e)}))));
  DNS.forEach((d,i)=>{
    const r=aRes[i]||{st:"unreach"},cell=document.getElementById("a"+i);
    const t=document.getElementById("tA").rows[i].cells[1];
    if(r.st==="ok"){t.innerHTML='<span class="tag t-ok">可用</span>';cell.textContent=r.ms+" ms";}
    else if(r.st==="cors"){t.innerHTML='<span class="tag t-warn">可达(跨域受限)</span>';cell.textContent=r.ms+" ms";}
    else{t.innerHTML='<span class="tag t-bad">连不上</span>';cell.textContent=r.ms?r.ms+" ms":"超时";}
  });

  // ---- B: 解析本域名 ----
  rows("tB",DNS.map(d=>`<tr><td>${esc(d.n)}</td><td class="ip">${wait}</td><td id="b${DNS.indexOf(d)}">-</td></tr>`).join(""));
  const bRes=await Promise.all(DNS.map(d=>withTimeout(resolveOne(d,domain),8000).catch(e=>({st:"unreach"}))));
  const allIps=[];
  DNS.forEach((d,i)=>{
    const r=bRes[i]||{st:"unreach"},td=document.getElementById("tB").rows[i];
    const badge=document.getElementById("b"+i);
    if(r.st==="ok"&&r.ips.length){
      r.ips.forEach(ip=>{if(!allIps.includes(ip))allIps.push(ip)});
      td.cells[1].textContent=r.ips.join(", ");
      const cf=r.ips.filter(isCF).length;
      badge.innerHTML=cf?'<span class="tag t-warn">Cloudflare 节点</span>':'<span class="tag t-ok">源站 IP</span>';
    }else if(r.st==="cors"){
      td.cells[1].textContent="（跨域受限，取不到）";
      badge.innerHTML='<span class="tag t-warn">跨域受限</span>';
    }else if(r.st==="nx"){
      td.cells[1].textContent="无 A 记录";
      badge.innerHTML='<span class="tag t-bad">无记录</span>';
    }else{
      td.cells[1].textContent="解析失败";
      badge.innerHTML='<span class="tag t-bad">失败</span>';
    }
  });

  // ---- C: 连通性 ----
  const cts=[
    {n:"1.1.1.1 (Cloudflare)",u:"https://1.1.1.1/cdn-cgi/trace"},
    {n:"speed.cloudflare.com",  u:"https://speed.cloudflare.com/__down?bytes=100"},
    {n:"腾讯网(对照组)",       u:"https://www.qq.com/"},
    {n:"你的域名 "+domain,u:"https://"+domain+"/"}
  ];
  rows("tC",cts.map((c,i)=>`<tr><td>${esc(c.n)}</td><td id="c${i}">${wait}</td><td id="ct${i}">-</td></tr>`).join(""));
  const cRes=[];
  for(let i=0;i<cts.length;i++){
    const r=await tcpTest(cts[i].u, i===3?12000:8000);
    cRes.push(r);
    document.getElementById("c"+i).innerHTML=r.ok?'<span class="tag t-ok">通</span>':'<span class="tag t-bad">不通</span>';
    document.getElementById("ct"+i).textContent=r.ms+" ms";
  }

  // ---- D: 判定 ----
  const cfDNS=aRes[0]||{st:"unreach"},ggDNS=aRes[1]||{st:"unreach"};
  const foreignDead=(cfDNS.st==="unreach"||cfDNS.st==="fail")&&(ggDNS.st==="unreach"||ggDNS.st==="fail");
  const cfOK=cRes[0].ok||cRes[1].ok;
  const siteOK=cRes[3].ok, qqOK=cRes[2].ok;
  const failCnt=bRes.filter(r=>r.st==="unreach"||r.st==="fail").length;
  const okSets=bRes.filter(r=>r.st==="ok"&&r.ips.length).map(r=>r.ips.slice().sort().join(","));
  const polluted=new Set(okSets).size>1;
  const gotIP=allIps.length>0;
  const allCF=gotIP&&allIps.every(isCF);

  let cls="",t="",body="";
  if(siteOK){
    cls="ok";t="现在其实是通的";
    body="<p>当前网络下访问正常。可能是之前临时故障、或者换了网络/开了代理在测。</p><div class=\"fix\">如果朋友那边仍然打不开，请让他在<b>他自己的设备上</b>用本页面测一次，把结果发回来 —— 不同运营商、不同城市的故障点可能完全不同。</div>";
  }else if(!qqOK){
    cls="bad";t="整条网络都不正常";
    body="<p>连腾讯网都打不开，这不是你网站的问题，是这台设备本地的网络故障（断流、代理配置错误、DNS 全挂）。</p><div class=\"fix\">先让朋友检查：是否开着 VPN/代理、是否连着能用的 WiFi。恢复后重新诊断。</div>";
  }else if(!cfOK){
    cls="bad";t="真凶：连不上 Cloudflare 边缘节点（换域名救不了）";
    body="<p>本地网络正常、腾讯网也通，但 <b>1.1.1.1 和 speed.cloudflare.com 都连不上</b>。这说明卡在「用户 → Cloudflare 节点」这一层，DNS 解析得再对也没用。</p><p>根源：Cloudflare 免费版没有中国大陆节点，域名会落到香港/日本/美西，部分网段在国内三网被限速、丢包或直接阻断。</p><div class=\"fix\">怎么办：<br>· <b>换 CDN（推荐）</b>：把域名 DNS 迁到腾讯云 DNSPod，境内线路 CNAME 到<b>腾讯云 EdgeOne 国际站</b>（免备案），境外线路仍走 Cloudflare。<br>· <b>备案 + 境内节点</b>：最稳最快，需买腾讯云境内轻量服务器办 ICP 备案（约 1–3 周）。<br>· <b>Cloudflare for SaaS 优选</b>：保留 CF，用优选 IP 绕开被封网段；配置繁琐且优选 IP 会失效。<br><br><b>注意：此时把域名迁到腾讯云、但源站仍指向 Cloudflare，是无效的。</b></div>";
  }else if(polluted){
    cls="bad";t="DNS 污染：不同解析器答案不一致";
    body="<p>几个能用的解析器对同一个域名给出了<b>不同答案</b>，这是典型的 DNS 污染。</p><div class=\"fix\">这种情况<b>才真正需要换域名</b>：新域名托管到腾讯云 DNSPod（旧域名留在 Cloudflare 给海外用户），并确保新域名刚注册、没被干扰过。设备 DNS 写 <b>119.29.29.29</b> / <b>223.5.5.5</b>。</div>";
  }else if(failCnt>=2&&!gotIP){
    cls="bad";t="域名解析不出来";
    body="<p>多个解析器都解析不出这个域名。要么域名本身被干扰，要么 DNS 记录配置有误。</p><div class=\"fix\">先在 Cloudflare 控制台确认该域名有正确的 A/AAAA 记录且橙色云朵已开。若记录正常却被大面积解析失败，<b>换新域名</b>是唯一出路。</div>";
  }else if(foreignDead&&gotIP){
    cls="warn";t="1.1.1.1 / 8.8.8.8 不可用，但网站解析正常";
    body="<p>你的说法成立了一半：<b>境外公共 DNS 在这个网络里确实连不上</b>，但阿里/腾讯的 DNS 能正常解析出你的域名。既然解析这一步是通的，问题就不在 DNS。</p><div class=\"fix\">分两种情况：<br>· 如果朋友设备里把 DNS 手动设成了 1.1.1.1 → <b>改回 119.29.29.29 / 223.5.5.5 就能好，不需要买域名</b>。<br>· 如果他们用的是运营商默认 DNS 且仍打不开 → 看上面 C 表，Cloudflare 通了但站点失败，那是站点配置问题（证书/橙云），不是网络问题。</div>";
  }else{
    cls="warn";t="Cloudflare 可连，但你的域名仍打不开";
    body="<p>Cloudflare 通路本身是通的，只有你的站点失败，说明问题在域名解析结果或服务端配置。</p><div class=\"fix\">请检查：Cloudflare 控制台该域名是否已<b>开启橙色云朵</b>（代理）、SSL 模式是否为 <b>Full (strict)</b>、Universal SSL 证书是否已签发。也可用上方 B 表确认解析结果是否指向了正确的 Cloudflare 段（解析到 Cloudflare 段是正常的）。</div>";
  }
  document.getElementById("verdict").className="verdict "+cls;
  document.getElementById("verdict").innerHTML='<div class="vt">'+t+'</div>'+body;

  // ---- E: 报告 ----
  const L=[],nl=L.join("\n");
  const y=dt=>esc((dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")+" "+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0")));
  L.push("【网站访问诊断报告】","时间："+y(new Date()),"设备："+navigator.platform||"未知","域名："+domain,"");
  const st=s=>({ok:"OK  ",cors:"CORS",nx:"无记录",unreach:"不可达",fail:"失败"}[s]||"?");
  L.push("— A. 公共 DNS 连通性 —");
  DNS.forEach((d,i)=>{const r=aRes[i]||{};L.push("  "+st(r.st)+"  "+d.n+(r.ms?"  "+r.ms+"ms":""))});
  L.push("","— B. 解析结果 —");
  DNS.forEach((d,i)=>{const r=bRes[i]||{};L.push("  "+((r.ips&&r.ips.length)?r.ips.join(", "):"-")+"   ("+d.n+")")});
  L.push("","— C. 连通性 —");
  cts.forEach((c,i)=>{L.push("  "+(cRes[i].ok?"OK  ":"FAIL")+"  "+c.n+"  "+cRes[i].ms+"ms")});
  L.push("","— D. 结论 —","  "+t);L.push("");
  document.getElementById("report").value=L.join("\n");

  btn.disabled=false;btn.textContent="开始诊断";
}
</script>
</body>
</html>
